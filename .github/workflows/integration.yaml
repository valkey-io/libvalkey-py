name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.rst'
      - '**/*.md'
    branches:
      - main
      - '[0-9].[0-9]'
  pull_request:
    branches:
      - main
      - '[0-9].[0-9]'

permissions:
  contents: read #  to fetch code (actions/checkout)

jobs:

  run-tests:
    runs-on: ${{matrix.os}}
    timeout-minutes: 30
    strategy:
      max-parallel: 15
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15', 'pypy@3.11']
        os: ['ubuntu-slim', 'windows-latest', 'macos-latest']
      fail-fast: false
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
      UV_PYTHON_PREFERENCE: only-managed
    name: Python ${{ matrix.python-version }} ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.13.0'
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          no-project: true
          enable-cache: true
          cache-dependency-glob: dev_requirements.txt
      - name: run tests
        run: |
          uv pip install -U setuptools wheel
          uv pip install -r dev_requirements.txt
          python setup.py build_ext --inplace
          python -m pytest
      - name: build and install the wheel
        run: |
          python setup.py bdist_wheel

  # This is a noop job that is only needed for GitHub settings of the project.
  # GitHub doesn't allow requiring all the checks and instead makes you specify
  # all the jobs one by one. "run-tests" however is a matrix job and specifying
  # all of its possible items is tedious. So we add this job to make GitHub happy.
  verify_tests_succeeded:
    name: Verify that tests succeeded
    runs-on: ubuntu-latest
    needs: [run-tests]
    steps:
      - run: true
