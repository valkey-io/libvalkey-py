name: FreeBSD

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.rst'
      - '**/*.md'
    branches:
      - main
      - '[0-9].[0-9]'
  pull_request:
    branches:
      - main
      - '[0-9].[0-9]'

permissions:
  contents: read #  to fetch code (actions/checkout)

jobs:

  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
    name: Python 3.11 FreeBSD
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: build and test
        uses: vmactions/freebsd-vm@v1
        with:
          envs: 'ACTIONS_ALLOW_UNSECURE_COMMANDS'
          usesh: true
          sync: rsync
          copyback: false
          prepare: pkg install -y bash curl python311
          run: |
            curl -s https://bootstrap.pypa.io/get-pip.py -o get-pip.py
            python3.11 get-pip.py
            python3.11 -m pip install -U pip setuptools wheel
            python3.11 -m pip install -r dev_requirements.txt
            /usr/local/bin/python3.11 setup.py build_ext --inplace
            python3.11 -m pytest
            python3.11 setup.py bdist_wheel
